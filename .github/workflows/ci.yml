name: CI

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Svelte check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Control characters
        run: npm run check:chars

      - name: Prettier
        run: npm run format:check

      - name: Test
        run: npm test

      # The production build is part of `npm run verify` for the same reason it
      # is here: typecheck and svelte-check do not exercise the adapter, the
      # `?raw` asset imports or the Vite config, and discovering that at tag
      # time means discovering it too late.
      - name: Build
        run: npm run build

  # The twenty-odd Playwright specs are the durable proof of every phase's "done
  # when", and until this job existed nothing but a human remembering to run them
  # protected any of it.
  #
  # This is deliberately NOT folded into `npm run verify`: verify is a few-second
  # local check and must never download a 150 MB browser (CLAUDE.md, Commands). A
  # separate CI job does not have that constraint.
  #
  # It runs alongside `check` rather than after it. The two fail for different
  # reasons, and waiting for a lint error before finding out a walkthrough broke
  # just serialises the feedback.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The cache key has to be the *resolved* Playwright version, not the range in
      # package.json: browser builds are pinned per Playwright release, so a cache
      # restored across a version bump would hold a chromium the new Playwright
      # refuses to launch.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` is the apt half, which is never cached and is cheap; the
      # browser download is the 150 MB half, which is. On a hit, install only the
      # system libraries.
      - name: Install chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # `trace: "retain-on-failure"` (playwright.config.ts) writes a trace beside
      # each failure — useless if it stays on the runner. A red job should hand
      # back something openable in `npx playwright show-trace`.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The image is only pushed on a tag, but it is built on every change — a
  # Dockerfile that stopped working should fail the PR that broke it, not the
  # release that needed it.
  image:
    name: Build image${{ startsWith(github.ref, 'refs/tags/v') && ' and push' || '' }}
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/gain" >> "$GITHUB_OUTPUT"
          # On a tag the version is the tag. Off a tag, GITHUB_REF is something
          # like refs/pull/7/merge, and the slashes make it an invalid image
          # tag — this build is never pushed, so a fixed label will do.
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF#refs/tags/}" ;;
            *)           version="ci" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build${{ startsWith(github.ref, 'refs/tags/v') && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      # The image is only useful if it actually boots. A missing runtime
      # dependency or a broken CMD is invisible to `docker build`.
      #
      # Non-tag builds only, because those are the ones loaded into the local
      # daemon rather than pushed straight to the registry. A tag is cut from a
      # commit that already went through this on its way to main.
      - name: Smoke-test the image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker run -d --name gain-smoke \
            -e ORIGIN=http://localhost:3000 \
            -e SESSION_SECRET=ci-smoke-test-secret \
            -e OIDC_ISSUER=https://auth.example.com/application/o/gain/ \
            -e OIDC_CLIENT_ID=gain \
            -e OIDC_CLIENT_SECRET=secret \
            -e OIDC_REQUIRED_GROUP=gain-users \
            -p 3000:3000 '${{ steps.image.outputs.name }}:latest'
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then healthy=1; break; fi
            sleep 1
          done
          echo
          docker logs gain-smoke
          # The container must also be running as a non-root user.
          test "$(docker exec gain-smoke id -u)" != "0"
          docker rm -f gain-smoke
          test -n "$healthy"
