# GAIN — Portainer stack (ARCHITECTURE §3).
# One image, one container, one port, one volume. The reverse proxy terminates
# TLS and forwards to the container's fixed internal port 3000; GAIN_PORT is
# the host-side knob.
#
# Copy .env.example to .env beside this file and fill in the values.

services:
  gain:
    image: ghcr.io/mrprisoner/gain:latest
    build: .
    restart: unless-stopped
    ports:
      # Loopback only — the reverse proxy is the one thing that should ever
      # reach this port. Publishing on all interfaces put the app on the LAN
      # in plaintext, going around the TLS proxy entirely (review E12).
      - "127.0.0.1:${GAIN_PORT:-8420}:3000"
    volumes:
      - gain-data:/data
    # /data (the named volume above) is the only path the app writes to —
    # control.db, each user's gain.db, staged plan documents (Dockerfile's
    # VOLUME comment) — so a read-only root filesystem cannot regress that
    # without every db write failing loudly, which is the point (review E12).
    # /tmp is tmpfs because Node and SQLite (temp files during VACUUM INTO,
    # per README's live-backup recipe) assume a writable scratch directory
    # exists even though nothing under /app persists anything of its own.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      ORIGIN: ${ORIGIN} # public HTTPS URL — required by SvelteKit for CSRF + OIDC redirect
      OIDC_ISSUER: ${OIDC_ISSUER} # e.g. https://auth.example.com/application/o/gain/
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REQUIRED_GROUP: ${OIDC_REQUIRED_GROUP:-gain-users}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-} # optional — members get /admin (counts + reset)
      SESSION_SECRET: ${SESSION_SECRET}
      DATA_DIR: /data
      TZ: ${TZ:-Africa/Johannesburg}
      # Behind a reverse proxy: trust X-Forwarded-* for the client address.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: ${XFF_DEPTH:-1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gain-data:
